env: {}
log:
  loglevel: warning
dns:
  servers:
    - address: https://8.8.8.8/dns-query
      domains:
        - geosite:google
      tag: google-site-dns
    - address: https+local://223.5.5.5/dns-query
      domains:
        - geosite:cn
        - domain:example.com
      tag: ali-dns
    - address: https://1.1.1.1/dns-query
      tag: cf-dns
    - address: https://8.8.8.8/dns-query
      tag: cgoogle-dns
  queryStrategy: UseSystem
routing:
  domainStrategy: IPOnDemand
  rules:
    - type: field
      port: 53
      outboundTag: dns-out
    - type: field
      protocol:
        - bittorrent
      outboundTag: direct
    - type: field
      port: "443"
      network: udp
      outboundTag: block
    - type: field
      domain:
        - geosite:private
      outboundTag: direct
    - type: field
      ip:
        - geoip:private
      outboundTag: direct
    - type: field
      ip:
        - 1.1.1.1
        - 8.8.8.8
      outboundTag: proxy
    - type: field
      ip:
        - geoip:cn
      outboundTag: direct
    - type: field
      domain:
        - geosite:google
      outboundTag: proxy
    - type: field
      domain:
        - geosite:cn
      outboundTag: direct
    - type: field
      domain:
        - geosite:category-dev
      outboundTag: proxy
policy: {}
inbounds:
  - tag: default-in
    port: 12345
    protocol: tunnel
    settings:
      allowedNetwork: tcp,udp
      followRedirect: true
    streamSettings:
      sockopt:
        tproxy: tproxy
    sniffing:
      enabled: true
      destOverride:
        - http
        - tls
        - quic
outbounds:
  - tag: direct
    protocol: freedom
    settings:
      domainStrategy: ForceIP
  - tag: proxy
    protocol: vless
    settings:
      address: example.com
      port: 443
      id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      encryption: none
    streamSettings:
      network: xhttp
      security: tls
      xhttpSettings:
        path: /path
        mode: stream-one
  - tag: dns-out
    protocol: dns
    settings:
      rules:
        - action: hijack
  - tag: block
    protocol: blackhole
  - tag: block-ads
    protocol: blackhole
