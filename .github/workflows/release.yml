name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - version.env
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build release APK
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      title: ${{ steps.metadata.outputs.title }}
      asset: ${{ steps.metadata.outputs.asset }}
    env:
      OPENWRT_VERSION: "25.12.5"
      OPENWRT_TARGET: x86
      OPENWRT_SUBTARGET: "64"
      SDK_ARCHIVE: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
      SDK_SHA256: "0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c"
      SDK_DIRECTORY: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64
      SDK_PREP_REV: "1"
      SDK_CACHE_ROOT: ${{ github.workspace }}/.cache/openwrt-sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes jq

      - name: Resolve package and release versions
        id: metadata
        shell: bash
        env:
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          source version.env
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$RELEASE" =~ ^[0-9]+$ ]]; then
            echo "Invalid VERSION or RELEASE in version.env: $VERSION-r$RELEASE" >&2
            exit 1
          fi
          package_version="$VERSION-r$RELEASE"

          expected_tag="v${package_version}"
          if [[ "$SOURCE_REF_TYPE" == "tag" && "$SOURCE_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $SOURCE_REF_NAME does not match version.env version $expected_tag" >&2
            exit 1
          fi

          if [[ "$SOURCE_REF_TYPE" == "branch" &&
                "$SOURCE_REF_NAME" != "master" ]]; then
            echo "Manual releases must run from master" >&2
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
          echo "title=luci-app-nftflow ${package_version}" >> "$GITHUB_OUTPUT"
          echo "asset=dist/luci-app-nftflow-${package_version}.apk" >> "$GITHUB_OUTPUT"

      - name: Restore prepared OpenWrt SDK
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SDK_CACHE_ROOT }}
          key: ${{ runner.os }}-openwrt-sdk-${{ env.OPENWRT_VERSION }}-${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}-${{ env.SDK_ARCHIVE }}-${{ env.SDK_SHA256 }}-prepared-v${{ env.SDK_PREP_REV }}

      - name: Download OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          sdk_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}/${SDK_ARCHIVE}"
          sdk_file="$RUNNER_TEMP/$SDK_ARCHIVE"
          mkdir -p "$SDK_CACHE_ROOT"
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --output "$sdk_file" \
            "$sdk_url"

          printf '%s  %s\n' "$SDK_SHA256" "$sdk_file" |
            sha256sum --check --strict

          tar \
            --extract \
            --zstd \
            --file "$sdk_file" \
            --directory "$SDK_CACHE_ROOT"

      - name: Verify OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SDK_CACHE_ROOT/$SDK_DIRECTORY/staging_dir/host/bin/apk"
          test -x "$SDK_CACHE_ROOT/$SDK_DIRECTORY/staging_dir/host/bin/fakeroot"

      - name: Build release APK
        shell: bash
        env:
          OPENWRT_SDK: ${{ env.SDK_CACHE_ROOT }}/${{ env.SDK_DIRECTORY }}
          SDK_PREP_REV: ${{ env.SDK_PREP_REV }}
        run: |
          set -euo pipefail
          bash -n scripts/build-apk.sh
          bash ./scripts/build-apk.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nftflow-release-apk
          path: |
            ${{ steps.metadata.outputs.asset }}
            ${{ steps.metadata.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: build-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nftflow-release-apk
          path: release-artifact

      - name: Verify release artifact
        shell: bash
        env:
          VERSION: ${{ needs.build-release.outputs.version }}
        run: |
          set -euo pipefail
          apk_path="release-artifact/luci-app-nftflow-${VERSION}.apk"
          checksum_path="$apk_path.sha256"
          test -f "$apk_path"
          test -f "$checksum_path"
          expected_checksum="$(awk 'NR == 1 { print $1 }' "$checksum_path")"
          actual_checksum="$(sha256sum "$apk_path" | awk '{ print $1}')"
          test "$expected_checksum" = "$actual_checksum"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.build-release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build-release.outputs.title }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifact/luci-app-nftflow-${{ needs.build-release.outputs.version }}.apk
            release-artifact/luci-app-nftflow-${{ needs.build-release.outputs.version }}.apk.sha256
