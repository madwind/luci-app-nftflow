name: Temporary package

run-name: Temporary package · OpenWrt 25.12.5

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: temporary-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build · ${{ matrix.asset_arch }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_arch: x86_64
            target: x86
            subtarget: "64"
            sdk_archive: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c
            sdk_directory: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64
          - asset_arch: aarch64_generic
            target: rockchip
            subtarget: armv8
            sdk_archive: openwrt-sdk-25.12.5-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 59194a023968398af64bfa7d8bc3eac322641f6dc9cdbade28a4d9dd41866eba
            sdk_directory: openwrt-sdk-25.12.5-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64
    env:
      OPENWRT_VERSION: "25.12.5"
      OPENWRT_TARGET: ${{ matrix.target }}
      OPENWRT_SUBTARGET: ${{ matrix.subtarget }}
      SDK_ARCHIVE: ${{ matrix.sdk_archive }}
      SDK_SHA256: ${{ matrix.sdk_sha256 }}
      SDK_DIRECTORY: ${{ matrix.sdk_directory }}
      SDK_PREP_REV: "1"
      SDK_CACHE_ROOT: ${{ github.workspace }}/.cache/openwrt-sdk
      ASSET_ARCH: ${{ matrix.asset_arch }}
      TEMP_PACKAGE_NAME: ${{ secrets.TEMP_PACKAGE_NAME }}
      TEMP_PACKAGE_VERSION: ${{ secrets.TEMP_PACKAGE_VERSION }}
      TEMP_PACKAGE_RELEASE: ${{ secrets.TEMP_PACKAGE_RELEASE }}
      TEMP_PACKAGE_HASH: ${{ secrets.TEMP_PACKAGE_HASH }}
      TEMP_SOURCE_URL: ${{ secrets.TEMP_SOURCE_URL }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in TEMP_PACKAGE_NAME TEMP_PACKAGE_VERSION TEMP_PACKAGE_RELEASE TEMP_PACKAGE_HASH TEMP_SOURCE_URL; do
            [[ -n "${!name:-}" ]] || {
              echo "Required repository secret is missing: $name" >&2
              exit 1
            }
          done

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore prepared OpenWrt SDK
        id: sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SDK_CACHE_ROOT }}
          key: ${{ runner.os }}-temp-sdk-${{ env.OPENWRT_VERSION }}-${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}-${{ env.SDK_ARCHIVE }}-${{ env.SDK_SHA256 }}-prepared-v${{ env.SDK_PREP_REV }}

      - name: Download OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          sdk_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}/${SDK_ARCHIVE}"
          sdk_file="$RUNNER_TEMP/$SDK_ARCHIVE"
          mkdir -p "$SDK_CACHE_ROOT"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --output "$sdk_file" \
            "$sdk_url"

          printf '%s  %s\n' "$SDK_SHA256" "$sdk_file" |
            sha256sum --check --strict

          tar \
            --extract \
            --zstd \
            --file "$sdk_file" \
            --directory "$SDK_CACHE_ROOT"

      - name: Verify OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SDK_CACHE_ROOT/$SDK_DIRECTORY/staging_dir/host/bin/apk"
          test -x "$SDK_CACHE_ROOT/$SDK_DIRECTORY/scripts/feeds"

      - name: Prepare OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          OPENWRT_SDK: ${{ env.SDK_CACHE_ROOT }}/${{ env.SDK_DIRECTORY }}
        run: |
          set -euo pipefail

          sdk="$OPENWRT_SDK"
          "$sdk/scripts/feeds" update base packages
          "$sdk/scripts/feeds" install -a >/dev/null

          if [[ ! -f "$sdk/.config" ]]; then
            make -C "$sdk" defconfig
          fi

      - name: Save prepared OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SDK_CACHE_ROOT }}
          key: ${{ runner.os }}-temp-sdk-${{ env.OPENWRT_VERSION }}-${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}-${{ env.SDK_ARCHIVE }}-${{ env.SDK_SHA256 }}-prepared-v${{ env.SDK_PREP_REV }}

      - name: Build temporary package
        shell: bash
        env:
          OPENWRT_SDK: ${{ env.SDK_CACHE_ROOT }}/${{ env.SDK_DIRECTORY }}
        run: |
          set -euo pipefail
          bash -n scripts/build-temp-package.sh
          bash ./scripts/build-temp-package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: temporary-package-${{ matrix.asset_arch }}
          path: dist/temporary-package-*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish temporary release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENWRT_VERSION: "25.12.5"
      TEMP_PACKAGE_VERSION: ${{ secrets.TEMP_PACKAGE_VERSION }}
      TEMP_PACKAGE_RELEASE: ${{ secrets.TEMP_PACKAGE_RELEASE }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: temporary-package-*
          path: release-artifact
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${TEMP_PACKAGE_VERSION:-}" ]] || {
            echo "Required repository secret is missing: TEMP_PACKAGE_VERSION" >&2
            exit 1
          }
          [[ -n "${TEMP_PACKAGE_RELEASE:-}" ]] || {
            echo "Required repository secret is missing: TEMP_PACKAGE_RELEASE" >&2
            exit 1
          }

          tag="temporary-${TEMP_PACKAGE_VERSION}-r${TEMP_PACKAGE_RELEASE}-openwrt-${OPENWRT_VERSION}"
          title="Temporary package ${TEMP_PACKAGE_VERSION}-r${TEMP_PACKAGE_RELEASE}"
          notes="Temporary compatibility packages built for OpenWrt ${OPENWRT_VERSION}. Remove this workflow after the official package feed catches up."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-artifact/*.apk --clobber
          else
            gh release create "$tag" release-artifact/*.apk \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
